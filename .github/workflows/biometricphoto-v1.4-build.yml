name: Build BiometricPhoto v1.4.0

on:
  push:
    branches:
      - biometricphoto-v1.4-build
    paths:
      - trigger-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct BiometricPhoto source
        run: |
          rm -rf /tmp/biometric-src
          mkdir -p /tmp/biometric-src
          cat biometric-src/part-* | base64 -d > /tmp/BiometricPhoto-source.zip
          unzip -q /tmp/BiometricPhoto-source.zip -d /tmp/biometric-src
          mkdir -p /tmp/biometric-src/app/src/main/res/font
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf \
            -o /tmp/biometric-src/app/src/main/res/font/vazirmatn.ttf

      - name: Build debug APK
        working-directory: /tmp/biometric-src
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp /tmp/biometric-src/app/build/outputs/apk/debug/app-debug.apk BiometricPhoto-v1.4.0.apk
          sha256sum BiometricPhoto-v1.4.0.apk > BiometricPhoto-v1.4.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiometricPhoto-v1.4.0-apk
          path: |
            BiometricPhoto-v1.4.0.apk
            BiometricPhoto-v1.4.0.apk.sha256
          if-no-files-found: error
          retention-days: 7
